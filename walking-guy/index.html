<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2130">
<title>walking guy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="sun"></div>
  <div class="ground"></div>

  <div class="walker">
    <div class="bob">
      <svg class="character" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg" overflow="visible">
        <g class="leg back">
          <rect x="49" y="90" width="14" height="40" rx="4" fill="#3c2a1a"/>
          <rect x="46" y="126" width="20" height="10" rx="3" fill="#23252b"/>
          <rect x="46" y="134" width="20" height="4" rx="2" fill="#b7bcc4"/>
        </g>

        <g class="arm back">
          <rect x="51" y="46" width="10" height="32" rx="5" fill="#e9b98d"/>
        </g>

        <rect class="torso" x="38" y="40" width="36" height="52" rx="8" fill="#d99a2b"/>
        <rect x="50" y="32" width="12" height="10" fill="#e9b98d"/>

        <g class="head">
          <circle cx="56" cy="24" r="15" fill="#e9b98d"/>
          <ellipse cx="60" cy="29" rx="13" ry="9" fill="#3b2a1c"/>
          <path d="M42,20 Q56,2 70,20" stroke="#1c1c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="44" cy="24" r="7" fill="#1c1c1c"/>
          <rect x="42" y="6" width="30" height="13" rx="6" fill="#1c1c1c"/>
          <rect x="60" y="13" width="18" height="5" rx="2" fill="#1c1c1c"/>
        </g>

        <g class="arm front">
          <rect x="51" y="46" width="10" height="32" rx="5" fill="#e9b98d"/>
        </g>

        <g class="leg front">
          <rect x="49" y="90" width="14" height="40" rx="4" fill="#3c2a1a"/>
          <rect x="46" y="126" width="20" height="10" rx="3" fill="#23252b"/>
          <rect x="46" y="134" width="20" height="4" rx="2" fill="#b7bcc4"/>
        </g>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
