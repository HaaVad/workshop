<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarterly Review: Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12060a;
    --panel: #1f0d14;
    --panel-2: #2b1219;
    --ink: #fdf0d5;
    --muted: #b39a9f;
    --accent: #ffd60a;
    --blood: #c1121f;
    --ok: #57cc99;
    --warn: #ff9f1c;
    --bad: #ef476f;
    --pixel: "Press Start 2P", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  body { overflow-x: hidden; }
  button { font-family: var(--pixel); cursor: pointer; }
  .screen { display: none; min-height: 100%; }
  .screen.active { display: block; }

  #debug-banner {
    display: none; position: fixed; z-index: 50; left: 0; right: 0; top: 0;
    background: repeating-linear-gradient(45deg, #ff006e 0 18px, #ffbe0b 18px 36px);
    color: #000; font: 12px/1.6 var(--pixel); text-align: center; padding: 8px 16px; text-shadow: 0 0 4px #fff;
  }
  body.debug #debug-banner { display: block; }

  /* ---------- setup ---------- */
  #setup { padding: 32px 16px 64px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  body.debug #setup { padding-top: 72px; }
  h1 { font: 28px/1.4 var(--pixel); margin: 0 0 6px; color: var(--accent); text-shadow: 3px 3px 0 var(--blood); }
  .sub { font: 11px/1.8 var(--pixel); color: var(--muted); margin: 0 0 20px; }
  .snap { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .snap.stale { color: var(--warn); }
  .snap code { background: #0008; padding: 2px 6px; border-radius: 4px; color: var(--ink); }
  .snap-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .snap-row .snap { margin-bottom: 0; }
  #refresh {
    flex: none; width: 44px; height: 44px; font: 22px/1 system-ui, sans-serif; color: var(--accent);
    background: var(--panel); border: 3px solid var(--accent); border-radius: 4px; box-shadow: 3px 3px 0 var(--blood);
  }
  #refresh:disabled { cursor: progress; }
  #refresh.spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; margin-bottom: 20px; }
  .label { font: 10px var(--pixel); color: var(--muted); margin: 0 0 10px; letter-spacing: 1px; }
  .dept {
    flex: 1 1 200px; background: var(--panel); border: 3px solid #3a1a22; color: var(--ink);
    padding: 16px; text-align: left; border-radius: 4px;
  }
  .dept b { display: block; font-size: 14px; margin-bottom: 10px; }
  .dept span { font-size: 10px; color: var(--muted); }
  .dept.on { border-color: var(--accent); background: var(--panel-2); box-shadow: 4px 4px 0 var(--blood); }
  .wins button {
    background: var(--panel); color: var(--ink); border: 3px solid #3a1a22; padding: 14px 20px; font-size: 13px; border-radius: 4px;
  }
  .wins button.on { border-color: var(--accent); color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 10px; font: 10px var(--pixel); color: var(--muted); cursor: pointer; }
  .toggle input { width: 20px; height: 20px; accent-color: #ff006e; }
  .pool { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 20px; margin-top: 8px; }
  @media (max-width: 720px) { .pool { grid-template-columns: 1fr; } h1 { font-size: 18px; } }
  .count { background: var(--panel); border-radius: 4px; padding: 20px; border: 3px solid #3a1a22; }
  .count .big { font: 44px/1.2 var(--pixel); color: var(--accent); }
  .count .of { font: 12px/1.8 var(--pixel); color: var(--muted); }
  .count .msg { margin-top: 14px; font-size: 14px; line-height: 1.5; }
  .count .msg.warn { color: var(--warn); }
  .count .dur { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .people { background: var(--panel); border-radius: 4px; padding: 12px; border: 3px solid #3a1a22; max-height: 360px; overflow: auto; }
  .person { display: flex; justify-content: space-between; gap: 10px; padding: 6px 8px; font-size: 14px; border-bottom: 1px solid #ffffff10; }
  .person.out { color: var(--muted); }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .chip.eligible { background: #57cc9933; color: var(--ok); }
  .chip.not-eligible { background: #ffffff12; color: var(--muted); }
  .chip.unknown-404 { background: #ff9f1c22; color: var(--warn); }
  .chip.error { background: #ef476f33; color: var(--bad); }
  #start {
    margin-top: 28px; width: 100%; padding: 22px; font-size: 18px; color: #000; background: var(--accent);
    border: 0; border-radius: 4px; box-shadow: 6px 6px 0 var(--blood);
  }
  #start:disabled { background: #555; color: #999; box-shadow: none; cursor: not-allowed; }
  .hint { margin-top: 14px; font-size: 12px; color: var(--muted); }

  /* ---------- race ---------- */
  #race { position: fixed; inset: 0; background: #000; }
  #race.active { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; top: 2%; font: clamp(9px, 1.4vw, 18px)/1.5 var(--pixel); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; pointer-events: none; }
  #hud-left { left: 2%; }
  #hud-right { right: 2%; text-align: right; color: var(--accent); }
  body.debug .hud { top: calc(2% + 34px); }
  #announcer { position: absolute; left: 0; right: 0; top: 16%; text-align: center; pointer-events: none; padding: 0 16px; }
  #announcer .main { font: clamp(14px, 2.6vw, 40px)/1.4 var(--pixel); color: #fff; text-shadow: 3px 3px 0 var(--blood), -2px -2px 0 #000, 2px -2px 0 #000; }
  #announcer .subl { margin-top: 10px; font: clamp(9px, 1.3vw, 18px)/1.5 var(--pixel); color: var(--accent); text-shadow: 2px 2px 0 #000; }
  #announcer.pop { animation: pop 0.25s ease-out; }
  @keyframes pop { from { transform: scale(1.4); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }
  #countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: clamp(40px, 10vw, 140px) var(--pixel); color: var(--accent); text-shadow: 6px 6px 0 var(--blood); pointer-events: none; }
  .ctrl { position: absolute; bottom: 3%; display: flex; gap: 10px; }
  .ctrl button { background: #000a; color: #fff; border: 2px solid #fff6; padding: 10px 14px; font-size: clamp(8px, 1vw, 13px); border-radius: 4px; }
  #ctrl-left { left: 2%; }
  #ctrl-right { right: 2%; }

  /* ---------- results ---------- */
  #results { padding: 40px 16px 64px; text-align: center; }
  body.debug #results { padding-top: 80px; }
  #results h2 { font: 22px/1.5 var(--pixel); color: var(--accent); margin: 0 0 8px; text-shadow: 3px 3px 0 var(--blood); }
  #results .sub { margin-bottom: 30px; }
  .winners { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin: 0 auto 30px; max-width: 1100px; }
  .winner { background: var(--panel); border: 3px solid var(--accent); border-radius: 6px; padding: 20px 24px; min-width: 220px; box-shadow: 6px 6px 0 var(--blood); }
  .winner img { width: 120px; height: 160px; image-rendering: pixelated; display: block; margin: 0 auto 12px; }
  .winner .name { font: clamp(14px, 2vw, 22px)/1.5 var(--pixel); }
  .winner.solo .name { font-size: clamp(18px, 3.4vw, 40px); }
  .stats { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
  .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .actions button { padding: 16px 20px; font-size: 12px; border-radius: 4px; border: 3px solid var(--accent); background: var(--panel); color: var(--ink); }
  .actions button.primary { background: var(--accent); color: #000; }
  .void { color: #ff006e; font: 12px/1.6 var(--pixel); margin-bottom: 20px; }

  /* ---------- PG-13 mode: pastel meadow instead of blood ---------- */
  body.pg {
    --bg: #0f2a1d;
    --panel: #173a28;
    --panel-2: #1f4a33;
    --muted: #a9c5b3;
    --accent: #ffd6e8;
    --blood: #ff6fa3;
  }
  body.pg .dept, body.pg .wins button, body.pg .modes button, body.pg .count, body.pg .people { border-color: #2c5a40; }
  body.pg .wins button.on, body.pg .modes button.on {
    background: var(--accent); color: var(--bg); border-color: var(--blood); box-shadow: 4px 4px 0 var(--blood);
  }
  .modes button {
    background: var(--panel); color: var(--ink); border: 3px solid #3a1a22; padding: 14px 20px; font-size: 13px; border-radius: 4px;
  }
  .modes button.on { border-color: var(--accent); color: var(--accent); }
  #refresh { display: none; }
</style>
</head>

<div id="debug-banner">⚠ DEBUG MODE — TIMESHEETS IGNORED, EVERYONE IS RUNNING. THIS RESULT DOES NOT COUNT. ⚠</div>

<section id="setup" class="screen active">

      <div>
        <p class="label">MODE</p>

    <div class="pool">

        <div class="msg" id="count-msg"></div>

      </div>
      <div class="people" id="people"></div>
    </div>

    <button id="start">START THE RUN ▶</button>
    <p class="hint">On the run screen: <b>S</b> skips to the result · <b>M</b> mutes · <b>Esc</b> aborts (no result)</p>

</section>

<section id="race" class="screen">
  <div id="stage">
    <canvas id="game"></canvas>
    <canvas id="overlay"></canvas>

    <div id="announcer"><div class="main"></div><div class="subl"></div></div>
    <div id="countdown"></div>
    <div class="ctrl" id="ctrl-left"><button id="mute">🔊 SOUND</button></div>
    <div class="ctrl" id="ctrl-right"><button id="skip">SKIP ▶▶</button></div>
  </div>
</section>

<section id="results" class="screen">
  <h2 id="res-title"></h2>
  <p class="sub" id="res-sub"></p>
  <div class="void" id="res-void"></div>
  <div class="winners" id="res-winners"></div>
  <div class="stats" id="res-stats"></div>
  <div class="actions">
    <button class="primary" id="copy">COPY RESULT</button>
    <button id="again">RUN AGAIN</button>
    <button id="back">BACK TO SETUP</button>
  </div>
</section>

  const rngBuf = new Uint32Array(1024);
  let rngIdx = rngBuf.length;
  function rand() {
    if (rngIdx >= rngBuf.length) {
      crypto.getRandomValues(rngBuf);
      rngIdx = 0;
    }
    return rngBuf[rngIdx++] / 4294967296;
  }
  const randRange = (a, b) => a + (b - a) * rand();
  const randInt = (n) => Math.floor(rand() * n);
  const pick = (arr) => arr[randInt(arr.length)];
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---- world constants (shared with the renderer) -----------------------------------------
  const DT = 1 / 60;
  const ROAD = 3; // half width of the corridor floor
  const SPEED = 7; // base run speed, units/s
  const CEIL_H = 3.2;
  const BODY = 0.22; // runner half width

  // Deterministic track geometry (same for every runner, so it confers no advantage).
  function hash1(n) {
    let x = Math.imul(n | 0, 0x27d4eb2d) ^ 0x165667b1;
    x = Math.imul(x ^ (x >>> 15), 0x85ebca6b);
    x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  const smooth = (a, b, v) => {
    const t = Math.min(1, Math.max(0, (v - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  function makeTrack(duration) {
    const len = SPEED * duration;
    const hellStart = SPEED * Math.max(3.5, duration * 0.2);
    const hellFull = Math.max(hellStart + SPEED * 3, len * 0.7);
    const track = {
      hellStart,
      hellFull,
      hell: (z) => smooth(hellStart, hellFull, z),
      // Wall height on a side (-1 / +1). 0 means the edge is open: a drop into lava.
      wallH(z, side) {
        const h = track.hell(z);
        if (h <= 0) return CEIL_H;
        const seg = Math.floor(z / 2.5);
        const thr = 0.35 + 0.45 * hash1(seg * 2 + (side > 0 ? 1 : 0));
        if (h > thr) return 0;
        return CEIL_H * (1 - 0.55 * h) * (0.75 + 0.25 * hash1(seg * 7 + 3));
      },
      hasCeiling(z) {
        const h = track.hell(z);
        return h < 0.25 + 0.25 * hash1(Math.floor(z / 2) * 13 + 5);
      },
    };
    return track;
  }

  // ---- obstacle catalogue -----------------------------------------------------------------
  // kind decides the death style; zone picks where on the office→hell gradient it appears.
  const OBSTACLES = {
    chair: { hw: 0.42, kind: 'squash', zone: 0, label: 'office chair' },
    printer: { hw: 0.6, kind: 'squash', zone: 0, label: 'printer' },
    cooler: { hw: 0.38, kind: 'squash', zone: 0, label: 'water cooler' },
    plant: { hw: 0.38, kind: 'squash', zone: 0, label: 'office plant' },
    coffee: { hw: 0.55, kind: 'slip', zone: 0, label: 'coffee spill' },
    cabinet: { hw: 0.5, kind: 'squash', zone: 0, label: 'filing cabinet' },
    shredder: { hw: 0.65, kind: 'cut', zone: 1, label: 'shredder' },
    burningdesk: { hw: 0.75, kind: 'burn', zone: 1, label: 'burning desk' },
    saw: { hw: 0.6, kind: 'cut', zone: 2, label: 'saw blade' },
    spikes: { hw: 0.95, kind: 'impale', zone: 2, label: 'spike pit' },
    fire: { hw: 0.5, kind: 'burn', zone: 2, label: 'fire pillar' },
    grinder: { hw: 0.85, kind: 'cut', zone: 2, label: 'meat grinder' },
  };
  // PG-13: same office start, then a meadow. "Dying" = getting happily distracted.
  const PG_OBSTACLES = {
    chair: { hw: 0.42, kind: 'sit', zone: 0, label: 'office chair' },
    printer: { hw: 0.6, kind: 'fix', zone: 0, label: 'printer' },
    cooler: { hw: 0.38, kind: 'chat', zone: 0, label: 'water cooler' },
    plant: { hw: 0.38, kind: 'smell', zone: 0, label: 'office plant' },
    coffee: { hw: 0.55, kind: 'slip', zone: 0, label: 'coffee spill' },
    cabinet: { hw: 0.5, kind: 'fix', zone: 0, label: 'filing cabinet' },
    tulips: { hw: 0.5, kind: 'smell', zone: 1, label: 'tulips' },
    kitten: { hw: 0.35, kind: 'pet', zone: 1, label: 'kitten' },
    roses: { hw: 0.6, kind: 'smell', zone: 2, label: 'roses' },
    sunflower: { hw: 0.4, kind: 'smell', zone: 2, label: 'sunflower' },
    puppy: { hw: 0.45, kind: 'pet', zone: 2, label: 'puppy' },
    bunny: { hw: 0.35, kind: 'pet', zone: 2, label: 'bunny' },
    picnic: { hw: 0.9, kind: 'picnic', zone: 2, label: 'picnic blanket' },
    haybale: { hw: 0.7, kind: 'nap', zone: 2, label: 'hay bale' },
    butterfly: { hw: 0.5, kind: 'chase', zone: 2, label: 'butterfly' },
  };
  const zoneTypes = (cat) => [0, 1, 2].map((zone) => Object.keys(cat).filter((k) => cat[k].zone === zone));

  // ---- race -------------------------------------------------------------------------------
  function createRace({ participants, winners, duration, theme = 'classic' }) {
    const CATALOGUE = theme === 'pg' ? PG_OBSTACLES : OBSTACLES;
    const ZONE_TYPES = zoneTypes(CATALOGUE);
    const n = participants.length;
    const W = Math.max(1, Math.min(winners, n));
    const trivial = n <= W; // everyone survives
    const T = duration;
    const lethalFrom = trivial ? Infinity : Math.max(4, T * 0.22); // cute bonks first
    const goreFrom = T * 0.5;
    const track = makeTrack(T);

    // Fisher–Yates: API order never decides start position.
    const order = shuffle(participants);
    const cols = Math.min(6, n);
    const runners = order.map((p, i) => {
      const row = Math.floor(i / cols);
      const col = i % cols;
      const inRow = Math.min(cols, n - row * cols);
      const span = Math.min(4.4, (inRow - 1) * 0.9);
      const x = inRow > 1 ? -span / 2 + (span * col) / (inRow - 1) : 0;
      return {
        id: p.id,
        name: p.name,
        x: x + randRange(-0.1, 0.1),
        z: -row * 1.0 + randRange(-0.15, 0.15),
        vx: 0,
        speed: SPEED,
        lane: x,
        alive: true,
        stun: 0,
        shoving: 0,
        pushed: 0, // just got shoved: no control, no jumping
        jump: 0, // remaining jump time (visual + safety)
        aggression: rand(),
        decided: new Map(), // obstacle id -> noticed?
        hitBy: new Set(),
        deathT: null,
        cause: null,
        place: null,
      };
    });

    const race = {
      n,
      W,
      T,
      trivial,
      lethalFrom,
      goreFrom,
      track,
      runners,
      obstacles: [],
      events: [],
      t: 0,
      alive: n,
      finished: false,
      endT: null,
      fireZ: null,
      nextObstacleId: 1,
      spawnTimer: 0.3,
      kills: 0,
    };

    race.tier = () => (race.t < lethalFrom ? 0 : race.t < goreFrom ? 1 : 2);
    race.targetAlive = (t) => {
      if (t <= lethalFrom) return n;
      const u = Math.min(1, (t - lethalFrom) / (T - lethalFrom));
      return n - (n - W) * Math.pow(u, 1.15);
    };

    function emit(e) {
      race.events.push({ t: race.t, ...e });
    }

    function aliveRunners() {
      return runners.filter((r) => r.alive);
    }

    function kill(r, cause, extra = {}) {
      if (!r.alive) return false;
      if (race.alive <= W) {
        // Never go below the requested number of survivors: a miracle saves them.
        r.stun = Math.max(r.stun, 0.8);
        emit({ type: 'miracle', runner: r, cause });
        return false;
      }
      r.alive = false;
      r.deathT = race.t;
      r.cause = cause;
      r.place = race.alive;
      race.alive--;
      race.kills++;
      emit({ type: 'death', runner: r, cause, tier: race.tier(), ...extra });
      if (race.alive <= W) finish();
      return true;
    }

    function bonk(r, what, extra = {}) {
      if (r.stun > 0.2) return;
      r.stun = 0.9;
      r.speed *= 0.5;
      emit({ type: 'bonk', runner: r, what, ...extra });
    }

    function finish() {
      if (race.finished) return;
      race.finished = true;
      race.endT = race.t;
      emit({ type: 'finish', winners: runners.filter((r) => r.alive) });
    }

    function spawnObstacle(list) {
      const front = Math.max(...list.map((r) => r.z));
      const z = front + 26 + randRange(0, 6);
      const h = track.hell(z);
      const zone = h < 0.25 ? 0 : h < 0.6 ? (rand() < 0.5 ? 0 : 1) : rand() < 0.25 ? 1 : 2;
      const type = pick(ZONE_TYPES[zone]);
      const def = CATALOGUE[type];
      // Aim loosely at a random runner's lane so obstacles meet the pack.
      const target = pick(list);
      const lim = ROAD - def.hw - 0.05;
      const x = Math.max(-lim, Math.min(lim, target.x + randRange(-0.9, 0.9)));
      race.obstacles.push({ id: race.nextObstacleId++, type, x, z, hw: def.hw, kind: def.kind, label: def.label });
    }

    function missChance() {
      const tier = race.tier();
      if (tier === 0) return 0.35; // bonks are free
      // Behind schedule -> runners get sloppier. Ahead of schedule -> they get careful.
      const lag = race.alive - race.targetAlive(race.t + 1.5);
      return Math.max(0, Math.min(0.9, 0.06 + 0.1 * lag));
    }

    function step() {
      if (race.finished) {
        race.t += DT;
        // Survivors keep jogging for the victory lap.
        for (const r of runners) if (r.alive) r.z += SPEED * DT;
        return;
      }
      race.t += DT;
      const t = race.t;
      const tier = race.tier();
      const list = aliveRunners();

      // Trivial race: a short cute jog, then everyone wins.
      if (trivial && t >= T) {
        finish();
        return;
      }

      // Spawn obstacles; faster when the pack is behind schedule.
      race.spawnTimer -= DT;
      if (race.spawnTimer <= 0) {
        spawnObstacle(list);
        const lag = Math.max(0, race.alive - race.targetAlive(t + 3));
        const rate = tier === 0 ? 2 : Math.min(6, 1.0 + 0.05 * race.alive + 0.5 * lag);
        race.spawnTimer = (1 / rate) * randRange(0.6, 1.4);
      }

      // Pack centre for rubber-banding (keeps everyone on screen, symmetric for all).
      const zs = list.map((r) => r.z).sort((a, b) => a - b);
      const centre = zs[Math.floor(zs.length / 2)];
      const miss = missChance();
      const shoveRate = tier === 0 ? 0.12 : 0.18 + 0.05 * Math.max(0, race.alive - race.targetAlive(t + 2));

      for (const r of list) {
        r.stun = Math.max(0, r.stun - DT);
        r.shoving = Math.max(0, r.shoving - DT);
        r.pushed = Math.max(0, r.pushed - DT);
        r.jump = Math.max(0, r.jump - DT);

        // forward motion
        const band = Math.max(-0.2, Math.min(0.3, (centre - r.z) * 0.09));
        const want = SPEED * (1 + band + randRange(-0.04, 0.04)) * (r.stun > 0 ? 0.45 : 1);
        r.speed += (want - r.speed) * Math.min(1, DT * 3);
        r.z += r.speed * DT;

        // steering: wander, then dodge noticed obstacles, stay away from open edges
        if (rand() < DT * 0.6) r.lane = randRange(-ROAD + 0.6, ROAD - 0.6);
        let desired = r.lane;
        for (const o of race.obstacles) {
          const dz = o.z - r.z;
          if (dz < 0 || dz > 9) continue;
          const reach = o.hw + BODY + 0.15;
          if (Math.abs(o.x - r.x) > reach + 0.3) continue;
          if (!r.decided.has(o.id)) r.decided.set(o.id, rand() >= miss);
          if (!r.decided.get(o.id)) continue;
          const left = o.x - reach - 0.15;
          const right = o.x + reach + 0.15;
          const canL = left > -ROAD + 0.3;
          const canR = right < ROAD - 0.3;
          desired = canL && (!canR || Math.abs(left - r.x) < Math.abs(right - r.x)) ? left : right;
          break;
        }
        const edgeL = track.wallH(r.z + 2, -1) > 0.5 ? -ROAD + 0.35 : -ROAD + 0.8;
        const edgeR = track.wallH(r.z + 2, 1) > 0.5 ? ROAD - 0.35 : ROAD - 0.8;
        desired = Math.max(edgeL, Math.min(edgeR, desired));
        if (r.stun <= 0 && r.pushed <= 0) r.vx += (desired - r.x) * 20 * DT;
        r.vx -= r.vx * Math.min(1, 5 * DT);
        r.x += r.vx * DT;

        // deliberate shove
        if (t > 1.2 && r.stun <= 0 && rand() < DT * shoveRate * (0.4 + r.aggression)) {
          const near = list.filter((o) => o !== r && Math.abs(o.z - r.z) < 0.9 && Math.abs(o.x - r.x) < 1.3);
          if (near.length) {
            const v = pick(near);
            const dir = v.x === r.x ? (rand() < 0.5 ? -1 : 1) : Math.sign(v.x - r.x);
            v.vx += dir * randRange(3, tier === 0 ? 5 : 8);
            v.pushed = 0.7;
            r.vx -= dir * 1;
            r.shoving = 0.35;
            emit({ type: 'shove', runner: r, victim: v });
          }
        }
      }

      // runner–runner bumping
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const a = list[i];
          const b = list[j];
          const dx = b.x - a.x;
          if (Math.abs(b.z - a.z) < 0.45 && Math.abs(dx) < BODY * 2) {
            const dir = dx === 0 ? (rand() < 0.5 ? -1 : 1) : Math.sign(dx);
            const push = (BODY * 2 - Math.abs(dx)) * 6;
            a.vx -= dir * push;
            b.vx += dir * push;
          }
        }
      }

      // Edges and obstacles, checked in shuffled order so nobody is processed first by default.
      for (const r of shuffle(list)) {
        if (!r.alive) continue;
        const side = r.x < 0 ? -1 : 1;
        if (Math.abs(r.x) > ROAD - BODY) {
          if (track.wallH(r.z, side) > 0.5) {
            const impact = Math.abs(r.vx);
            r.x = side * (ROAD - BODY);
            r.vx = -r.vx * 0.4;
            if (impact > 4.5 && tier === 2 && rand() < 0.5) kill(r, 'wall', { side });
            else if (impact > 2.5) bonk(r, 'wall');
          } else if (tier === 0) {
            r.x = side * (ROAD - BODY);
            r.vx = -r.vx * 0.4;
          } else {
            kill(r, 'fall', { side });
          }
          if (!r.alive) continue;
        }
        for (const o of race.obstacles) {
          if (r.hitBy.has(o.id)) continue;
          if (Math.abs(o.z - r.z) < 0.35 && Math.abs(o.x - r.x) < o.hw + BODY) {
            r.hitBy.add(o.id);
            // Saw it coming, in control, not dazed: hop over it.
            if (r.decided.get(o.id) === true && r.pushed <= 0 && r.stun <= 0) {
              r.jump = 0.55;
              continue;
            }
            if (tier === 0 || o.kind === 'slip' || (tier === 1 && rand() < 0.25)) bonk(r, o.label, { obstacle: o });
            else kill(r, o.kind, { obstacle: o });
            break;
          }
        }
      }

      // Deadline: after T, a wall of fire sweeps from behind and takes the hindmost.
      if (!race.finished && t >= T) {
        const now = aliveRunners();
        if (race.fireZ === null) {
          race.fireZ = Math.min(...now.map((r) => r.z)) - 5;
          emit({ type: 'deadline' });
        }
        race.fireZ += SPEED * 1.8 * DT;
        for (const r of shuffle(now)) if (r.z < race.fireZ) kill(r, 'deadline');
      }
      // Hard stop: whatever happens, the round ends.
      if (!race.finished && t >= T + 8) {
        for (const r of shuffle(aliveRunners())) kill(r, 'deadline');
      }

      // forget obstacles far behind everyone
      const back = Math.min(...runners.filter((r) => r.alive).map((r) => r.z));
      if (race.obstacles.length > 60) race.obstacles = race.obstacles.filter((o) => o.z > back - 30);
    }

    race.step = step;
    race.runToEnd = () => {
      let guard = 0;
      while (!race.finished && guard++ < 60 * 600) step();
      return race.winners();
    };
    race.winners = () => runners.filter((r) => r.alive);
    return race;
  }

  const Sim = { createRace, rand, randRange, randInt, pick, shuffle, hash1, DT, ROAD, SPEED, CEIL_H, OBSTACLES, PG_OBSTACLES };
  if (typeof module !== 'undefined') module.exports = Sim;
  else root.Sim = Sim;
})(this);
</script>
<script>// Procedural pixel-art sprites: runners (seen from behind), gibs, obstacles.
// Purely visual — nothing here touches the simulation.
(function (root) {
  'use strict';
  const { rand, randInt, pick } = root.Sim;

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  // Adds a dark 1px outline around every opaque pixel — the SNES look.
  function outline(c, color = '#1a0f14') {
    const ctx = c.getContext('2d');
    const { width: w, height: h } = c;
    const src = ctx.getImageData(0, 0, w, h).data;
    ctx.fillStyle = color;
    const solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] > 0;
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++)
        if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) ctx.fillRect(x, y, 1, 1);
    return c;
  }

  // ---- runner looks -----------------------------------------------------------------------
  const SKIN = ['#f6d3b3', '#e8b48f', '#c98e66', '#a0694a', '#7a4b33', '#5a3524', '#ffd9c4'];
  const HAIR = ['#2b1d14', '#5a3a22', '#a8642c', '#e3c06b', '#d9d2c4', '#111111', '#b8322a', '#7d55c7', '#2f8fd8', '#ff7ab8'];
  const SHIRT = ['#e84a5f', '#2a9d8f', '#f4a261', '#457b9d', '#8ac926', '#ffca3a', '#6a4c93', '#ff595e', '#1982c4', '#f15bb5', '#00bbf9', '#ffffff', '#3d3d3d', '#ef476f', '#06d6a0'];
  const PANTS = ['#264653', '#1d3557', '#3d405b', '#5c4033', '#2b2d42', '#6c757d', '#9d0208', '#386641', '#e9c46a'];
  const SHOES = ['#ffffff', '#111111', '#e63946', '#ffb703', '#8338ec'];
  const HAIRSTYLES = ['short', 'long', 'bald', 'ponytail', 'mohawk', 'afro', 'bun', 'spiky', 'pigtails'];
  const HATS = ['none', 'none', 'none', 'cap', 'beanie', 'party', 'viking', 'crown', 'cone', 'tophat', 'propeller', 'headphones'];
  const EXTRAS = ['none', 'none', 'backpack', 'cape', 'tie', 'laptopbag', 'guitar', 'wings', 'scarf'];
  const BUILDS = [
    { name: 'thin', torso: 6, leg: 2 },
    { name: 'normal', torso: 8, leg: 2 },
    { name: 'wide', torso: 10, leg: 3 },
    { name: 'round', torso: 11, leg: 3 },
  ];
  const STYLES = ['sprint', 'waddle', 'flail', 'bounce', 'stiff'];

  // Unique looks per round: re-roll until no two runners share the same signature.
  function rollLooks(count) {
    const seen = new Set();
    const looks = [];
    for (let i = 0; i < count; i++) {
      let l;
      let guard = 0;
      do {
        l = {
          skin: pick(SKIN),
          hair: pick(HAIR),
          shirt: pick(SHIRT),
          pants: pick(PANTS),
          shoes: pick(SHOES),
          hairstyle: pick(HAIRSTYLES),
          hat: pick(HATS),
          hatColor: pick(SHIRT),
          extra: pick(EXTRAS),
          extraColor: pick(SHIRT),
          build: pick(BUILDS),
          height: randInt(3), // 0 short, 1 normal, 2 tall
          style: pick(STYLES),
        };
        l.sig = [l.skin, l.hair, l.shirt, l.hairstyle, l.hat, l.extra, l.build.name].join('|');
      } while (seen.has(l.sig) && guard++ < 50);
      seen.add(l.sig);
      looks.push(l);
    }
    return looks;
  }

  // Runner from behind. 24 x 32 canvas, feet at bottom row. frame 0-3 run cycle, 4 = dazed.
  const RW = 24;
  const RH = 32;
  function drawRunner(look, frame) {
    const c = canvas(RW, RH);
    const g = c.getContext('2d');
    const px = (x, y, w, h, col) => {
      g.fillStyle = col;
      g.fillRect(x, y, w, h);
    };
    const cx = 12;
    const tw = look.build.torso;
    const legLen = 6 + look.height;
    const torsoH = 8 + look.height;
    const baseY = RH - 1; // feet
    const dazed = frame === 4;
    const phase = dazed ? 0 : frame;
    // style-specific bob / sway
    const bob = { sprint: [0, 1, 0, 1], waddle: [0, 0, 0, 0], flail: [0, 1, 0, 1], bounce: [0, 2, 0, 2], stiff: [0, 0, 0, 0] }[look.style][phase];
    const sway = look.style === 'waddle' ? [-1, 0, 1, 0][phase] : 0;
    const hipY = baseY - legLen - bob;
    const shoulderY = hipY - torsoH;
    const headY = shoulderY - 7;
    const bx = cx + sway;

    // legs (alternate lift)
    const lw = look.build.leg;
    const lift = dazed ? [0, 0] : [[0, 3], [1, 1], [3, 0], [1, 1]][phase];
    const legL = bx - Math.floor(tw / 2) + 1;
    const legR = bx + Math.ceil(tw / 2) - 1 - lw;
    px(legL, hipY, lw, legLen - lift[0], look.pants);
    px(legR, hipY, lw, legLen - lift[1], look.pants);
    px(legL - (lw > 2 ? 0 : 0), hipY + legLen - lift[0] - 1, lw + 1, 2, look.shoes);
    px(legR, hipY + legLen - lift[1] - 1, lw + 1, 2, look.shoes);

    // cape behind everything above legs
    if (look.extra === 'cape') {
      const flap = [0, 1, 2, 1][phase];
      px(bx - tw / 2 - 1, shoulderY + 1, tw + 2, torsoH + 3 + flap, look.extraColor);
    }
    if (look.extra === 'wings') {
      const f = [0, 2, 0, 2][phase];
      px(bx - tw / 2 - 5, shoulderY - 1 + f, 5, 6, '#f7f7ff');
      px(bx + tw / 2, shoulderY - 1 + f, 5, 6, '#f7f7ff');
    }

    // torso
    px(bx - tw / 2, shoulderY, tw, torsoH, look.shirt);
    px(bx - tw / 2, hipY - 1, tw, 1, look.pants); // belt line
    if (look.build.name === 'round') {
      px(bx - tw / 2 - 1, shoulderY + 2, 1, torsoH - 3, look.shirt);
      px(bx + tw / 2, shoulderY + 2, 1, torsoH - 3, look.shirt);
    }

    // arms swing opposite to legs (flail = arms up)
    const armUp = look.style === 'flail' ? [6, 2, 6, 2][phase] : dazed ? 0 : [0, 2, 4, 2][phase];
    const armL = bx - tw / 2 - 2;
    const armR = bx + tw / 2;
    const armLen = 7;
    if (look.style === 'flail' && !dazed) {
      px(armL, shoulderY - armUp, 2, armLen, look.shirt);
      px(armR, shoulderY - (8 - armUp), 2, armLen, look.shirt);
      px(armL, shoulderY - armUp - 1, 2, 2, look.skin);
      px(armR, shoulderY - (8 - armUp) - 1, 2, 2, look.skin);
    } else if (dazed) {
      px(armL - 1, shoulderY + 1, 2, armLen, look.shirt);
      px(armR + 1, shoulderY + 1, 2, armLen, look.shirt);
      px(armL - 1, shoulderY + armLen, 2, 2, look.skin);
      px(armR + 1, shoulderY + armLen, 2, 2, look.skin);
    } else {
      px(armL, shoulderY + 1 + armUp / 2, 2, armLen - 1, look.shirt);
      px(armR, shoulderY + 1 + (4 - armUp) / 2, 2, armLen - 1, look.shirt);
      px(armL, shoulderY + armLen + armUp / 2, 2, 2, look.skin);
      px(armR, shoulderY + armLen + (4 - armUp) / 2, 2, 2, look.skin);
    }

    // extras on the back
    if (look.extra === 'backpack') px(bx - 3, shoulderY + 2, 6, 6, look.extraColor);
    if (look.extra === 'laptopbag') {
      px(bx - tw / 2, shoulderY + 1, 1, torsoH - 2, '#222');
      px(bx + tw / 2 - 4, hipY - 3, 5, 4, '#333');
    }
    if (look.extra === 'guitar') {
      px(bx - 1, shoulderY - 3, 2, 8, '#7a4b1e');
      px(bx - 3, shoulderY + 5, 6, 5, '#c97b2a');
    }
    if (look.extra === 'tie') {
      const f = [0, 1, 2, 1][phase];
      px(bx + tw / 2, shoulderY + 1 + f, 3, 2, look.extraColor);
    }
    if (look.extra === 'scarf') {
      px(bx - 3, shoulderY - 1, 6, 2, look.extraColor);
      px(bx + 2, shoulderY + 1, 2, 4 + [0, 1, 2, 1][phase], look.extraColor);
    }

    // neck + head (back of head — mostly hair)
    px(bx - 1, shoulderY - 1, 3, 2, look.skin);
    const hx = bx - 3;
    px(hx, headY, 7, 7, look.skin);
    px(hx - 1, headY + 3, 1, 2, look.skin); // ears
    px(hx + 7, headY + 3, 1, 2, look.skin);
    const hc = look.hair;
    switch (look.hairstyle) {
      case 'short':
        px(hx, headY - 1, 7, 6, hc);
        break;
      case 'long':
        px(hx - 1, headY - 1, 9, 9, hc);
        px(hx, headY + 8, 7, 3, hc);
        break;
      case 'ponytail':
        px(hx, headY - 1, 7, 6, hc);
        px(bx - 1, headY + 4, 2, 4 + [0, 1, 0, 1][phase], hc);
        break;
      case 'mohawk':
        px(bx - 1, headY - 4, 3, 10, hc);
        break;
      case 'afro':
        px(hx - 2, headY - 3, 11, 9, hc);
        px(hx - 1, headY - 4, 9, 1, hc);
        break;
      case 'bun':
        px(hx, headY - 1, 7, 6, hc);
        px(bx - 2, headY - 4, 4, 3, hc);
        break;
      case 'spiky':
        px(hx, headY, 7, 5, hc);
        for (let i = 0; i < 4; i++) px(hx + i * 2, headY - 2 - (i % 2), 1, 3, hc);
        break;
      case 'pigtails':
        px(hx, headY - 1, 7, 6, hc);
        px(hx - 3, headY + 2 + [0, 1, 0, 1][phase], 3, 4, hc);
        px(hx + 7, headY + 2 + [1, 0, 1, 0][phase], 3, 4, hc);
        break;
      default: // bald: a little shine
        px(hx + 4, headY + 1, 1, 1, '#ffffff88');
    }
    const hatC = look.hatColor;
    switch (look.hat) {
      case 'cap':
        px(hx - 1, headY - 2, 9, 4, hatC);
        px(hx + 1, headY + 2, 5, 1, hatC);
        break;
      case 'beanie':
        px(hx - 1, headY - 3, 9, 5, hatC);
        px(bx - 1, headY - 5, 2, 2, '#fff');
        break;
      case 'party':
        for (let i = 0; i < 6; i++) px(bx - 3 + Math.ceil(i / 2), headY - 2 - i, 7 - Math.ceil(i / 2) * 2, 1, i % 2 ? hatC : '#ffe066');
        break;
      case 'viking':
        px(hx - 1, headY - 2, 9, 4, '#9aa0a6');
        px(hx - 3, headY - 5, 2, 4, '#f1e3c6');
        px(hx + 8, headY - 5, 2, 4, '#f1e3c6');
        break;
      case 'crown':
        px(hx, headY - 3, 7, 3, '#ffd60a');
        px(hx, headY - 5, 1, 2, '#ffd60a');
        px(bx, headY - 5, 1, 2, '#ffd60a');
        px(hx + 6, headY - 5, 1, 2, '#ffd60a');
        break;
      case 'cone':
        for (let i = 0; i < 7; i++) px(bx - 4 + Math.floor(i / 2), headY - i, 9 - Math.floor(i / 2) * 2, 1, i === 3 ? '#fff' : '#ff6b1a');
        break;
      case 'tophat':
        px(hx - 2, headY - 1, 11, 2, '#111');
        px(hx, headY - 7, 7, 6, '#111');
        px(hx, headY - 3, 7, 1, hatC);
        break;
      case 'propeller':
        px(hx - 1, headY - 2, 9, 3, hatC);
        px(bx, headY - 4, 1, 2, '#333');
        px(bx - 4 + (phase % 2) * 2, headY - 5, 7 - (phase % 2) * 4, 1, '#ff006e');
        break;
      case 'headphones':
        px(hx - 1, headY - 2, 9, 1, '#222');
        px(hx - 2, headY + 2, 2, 4, hatC);
        px(hx + 7, headY + 2, 2, 4, hatC);
        break;
    }
    return outline(c);
  }

  // ---- gore -------------------------------------------------------------------------------
  const BLOOD = '#c1121f';
  const BLOOD_D = '#6a040f';

  function gibSprites(look) {
    const head = canvas(11, 12);
    let g = head.getContext('2d');
    g.fillStyle = look.skin;
    g.fillRect(2, 2, 7, 7);
    g.fillStyle = look.hairstyle === 'bald' ? look.skin : look.hair;
    g.fillRect(2, 1, 7, 5);
    if (look.hat !== 'none') {
      g.fillStyle = look.hatColor;
      g.fillRect(1, 0, 9, 3);
    }
    g.fillStyle = BLOOD;
    g.fillRect(3, 9, 5, 2);
    outline(head);

    const limb = (col, end, len) => {
      const c = canvas(5, len + 4);
      const x = c.getContext('2d');
      x.fillStyle = col;
      x.fillRect(1, 1, 3, len);
      x.fillStyle = end;
      x.fillRect(1, len, 3, 2);
      x.fillStyle = BLOOD;
      x.fillRect(1, 0, 3, 2);
      return outline(c);
    };
    const torso = canvas(look.build.torso + 4, 14);
    g = torso.getContext('2d');
    g.fillStyle = look.shirt;
    g.fillRect(2, 2, look.build.torso, 10);
    g.fillStyle = BLOOD;
    g.fillRect(3, 1, look.build.torso - 2, 3);
    g.fillStyle = BLOOD_D;
    g.fillRect(4, 1, 2, 1);
    outline(torso);
    return { head, arm: limb(look.shirt, look.skin, 7), leg: limb(look.pants, look.shoes, 8), torso };
  }

  // flattened runner lying on the floor
  function pancake(look) {
    const c = canvas(26, 8);
    const g = c.getContext('2d');
    g.fillStyle = BLOOD;
    g.fillRect(0, 3, 26, 5);
    g.fillStyle = look.pants;
    g.fillRect(2, 4, 8, 3);
    g.fillStyle = look.shirt;
    g.fillRect(9, 3, 10, 4);
    g.fillStyle = look.hairstyle === 'bald' ? look.skin : look.hair;
    g.fillRect(19, 3, 5, 4);
    g.fillStyle = look.skin;
    g.fillRect(11, 1, 2, 2);
    g.fillRect(16, 6, 2, 2);
    return outline(c, '#3a0008');
  }

  function charred(sprite) {
    const c = canvas(sprite.width, sprite.height);
    const g = c.getContext('2d');
    g.drawImage(sprite, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = '#1b1414';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#ff6b1a';
    for (let i = 0; i < 14; i++) g.fillRect(randInt(c.width), randInt(c.height), 1, 1);
    return c;
  }

  function staticSprite(w, h, fn) {
    const c = canvas(w, h);
    fn(c.getContext('2d'), (x, y, ww, hh, col) => {
      const g = c.getContext('2d');
      g.fillStyle = col;
      g.fillRect(x, y, ww, hh);
    });
    return outline(c);
  }

          px(10, 2, 3, 2, '#ffd60a');
        }),
      ],
    };
    o.haybale = {
      h: 1.0,
      frames: [
        staticSprite(30, 22, (g, px) => {

          px(2, 0, 26, 2, '#e9c46a');
          for (let i = 0; i < 6; i++) px(2 + i * 5, 3, 1, 17, '#d4a373');
          px(0, 8, 30, 1, '#bc6c25');
          px(0, 15, 30, 1, '#bc6c25');
        }),
      ],
    };
    o.butterfly = {
      h: 1.3,
      frames: [0, 1].map((f) =>
        staticSprite(22, 30, (g, px) => {
          const wing = (x, y, col) => (f ? px(x + 1, y + 1, 3, 4, col) : px(x, y, 5, 6, col));
          wing(4, 2, '#c77dff');
          wing(13, 2, '#c77dff');
          wing(5, 8, '#ff8fab');
          wing(12, 8, '#ff8fab');
          px(10, 3, 2, 10, '#3d3d3d');
          px(9, 0, 1, 3, '#3d3d3d');
          px(12, 0, 1, 3, '#3d3d3d');
          // a second, smaller one lower down
          px(f ? 3 : 2, 20, f ? 2 : 3, 3, '#ffd60a');
          px(5, 21, 1, 3, '#3d3d3d');
          px(6, 20, f ? 2 : 3, 3, '#ffd60a');
        })
      ),
    };
    // Not an obstacle: the PG-13 "deadline" that sweeps up the hindmost.
    o.truck = {
      h: 1.6,
      frames: [0, 1].map((f) =>
        staticSprite(44, 38, (g, px) => {
          px(2, 12, 40, 20, '#ffc8dd');
          px(2, 12, 40, 3, '#ff8fab');
          px(6, 17, 14, 8, '#bde0fe');
          px(24, 17, 14, 8, '#bde0fe');
          px(2, 27, 40, 2, '#ffffff');
          px(6, 30, 8, 8, '#2b2d42');
          px(30, 30, 8, 8, '#2b2d42');
          px(8, 32, 4, 4, '#adb5bd');
          px(32, 32, 4, 4, '#adb5bd');
          // giant cone on the roof
          px(18, 0, 8, 6, f ? '#ffc8dd' : '#caffbf');
          px(17, 2, 10, 4, f ? '#ffc8dd' : '#caffbf');
          for (let i = 0; i < 6; i++) px(18 + Math.floor(i / 2), 6 + i, 8 - Math.floor(i / 2) * 2, 1, '#e9c46a');
        })

  }

  root.Sprites = { rollLooks, makeRunnerSprites, gibSprites, pancake, charred, skull, thumbsUp, obstacleSprites, pgObstacleSprites, sitting, lying, PETALS, RW, RH, PX, BLOOD, BLOOD_D };
})(this);
